<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上海买房板块地图 · 环线与地铁</title>
<style>/*__LEAFLET_CSS__*/</style>
<script>/*__LEAFLET_JS__*/</script>
<style>
  :root{
    --ink:#1a202c; --ink2:#4a5568; --ink3:#8894a8;
    --surface:#ffffff; --panel:rgba(255,255,255,.96);
    --ring-inner:#c62828; --ring-mid:#ef6c00; --ring-outer:#1565c0; --ring-sub:#2e7d32;
  }
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);}
  #app{display:flex;flex-direction:column;height:100%;}
  header{padding:9px 16px 7px;background:var(--surface);border-bottom:1px solid #e6eaf0;z-index:1000;}
  header h1{margin:0;font-size:17px;font-weight:700;}
  header p{margin:3px 0 0;font-size:12px;color:var(--ink3);}
  #map{flex:1;background:#f2f4f7;}
  .panel{position:absolute;z-index:900;background:var(--panel);border:1px solid #e2e8f0;border-radius:10px;
         box-shadow:0 2px 10px rgba(20,30,50,.10);font-size:12px;line-height:1.55;}
  #layers{top:12px;right:12px;padding:10px 12px;min-width:136px;}
  #layers label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;color:var(--ink2);}
  #layers input{accent-color:#334155;}
  #legend{bottom:22px;right:12px;padding:10px 12px;max-width:216px;max-height:52vh;overflow:auto;}
  #legend h4{margin:0 0 5px;font-size:12px;}
  #legend .row{display:flex;align-items:center;gap:7px;margin:2px 0;color:var(--ink2);white-space:nowrap;}
  #legend .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:10px;}
  .swArea{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);flex:none;}
  .lineSw{width:22px;height:0;border-top:4px solid;border-radius:2px;flex:none;}
  .lineSw.dash{border-top-style:dashed;border-top-width:3px;}
  #legend hr{border:none;border-top:1px solid #e8edf3;margin:7px 0;}
  /* 视图切换 */
  .view-toggle{display:flex;gap:2px;margin-bottom:8px;padding:2px;border:1px solid #d1d9e6;border-radius:8px;background:#f1f5f9;}
  .view-btn{flex:1;text-align:center;padding:5px 8px;cursor:pointer;font-size:11.5px;color:var(--ink2);
    border:none;border-radius:6px;background:transparent;font-weight:500;font-family:inherit;
    transition:background .15s,color .15s,box-shadow .15s;}
  .view-btn:hover{background:rgba(51,65,85,.08);}
  .view-btn.active{background:#334155;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);}
  .view-sep{border:none;border-top:1px solid #e2e8f0;margin:7px 0;}
  /* 板块名标签 */
  .twLbl{background:transparent;border:none;pointer-events:none;}
  .twLbl span{display:block;transform:translate(-50%,-50%);white-space:nowrap;text-align:center;
      font-weight:600;color:#243044;font-size:var(--lblFs,10px);
      text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 1px 4px #fff;}
  .twLbl .pr{font-weight:500;color:#5b3d3d;font-size:calc(var(--lblFs,10px) - 1px);}
  /* 弹窗 */
  .leaflet-popup-content{margin:10px 14px;font-size:13px;line-height:1.6;}
  .pp-title{font-weight:700;font-size:14.5px;}
  .pp-sub{color:var(--ink3);font-size:11px;}
  .pp-price{font-size:14px;font-weight:700;margin-top:2px;}
  .pp-note{color:var(--ink3);font-size:11px;margin-top:4px;}
  .pp-bd{margin:3px 0 0;padding:0;list-style:none;font-size:12.5px;}
  .pp-bd li{display:flex;justify-content:space-between;gap:14px;}
  #tileNote{position:absolute;left:12px;bottom:22px;z-index:900;background:rgba(255,251,235,.95);border:1px solid #f4e3b2;
            border-radius:8px;padding:6px 10px;font-size:11px;color:#8a6d1a;display:none;max-width:250px;}
  footer{padding:5px 16px;background:var(--surface);border-top:1px solid #e6eaf0;font-size:10.5px;color:var(--ink3);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>上海买房板块地图 · 环线 &amp; 地铁 <span id="verBadge" style="font-size:11px;font-weight:500;color:#8894a8;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:10px;padding:1px 8px;vertical-align:2px;"></span></h1>
    <p>按行政区着色 · 公路实线 / 地铁虚线 · 点击查看参考房价（<span class="dataDateCn">最新</span>挂牌价，仅供参考）</p>
  </header>
  <div style="position:relative;flex:1;display:flex;">
    <div id="map"></div>
    <div id="layers" class="panel">
      <div class="view-toggle" id="viewToggle">
        <button class="view-btn active" data-view="cell">板块级</button>
        <button class="view-btn" data-view="town">街镇级</button>
      </div>
      <label><input type="checkbox" id="ckFill" checked> 区域填色</label>
      <label><input type="checkbox" id="ckLbl" checked> 名称标签</label>
      <label><input type="checkbox" id="ckPr" checked> 房价标签</label>
      <hr class="view-sep">
      <label><input type="checkbox" id="ckRings" checked> 环线公路</label>
      <label><input type="checkbox" id="ckMetro" checked> 地铁线路</label>
      <label><input type="checkbox" id="ckTown"> 街镇界参考</label>
    </div>
    <div id="legend" class="panel">
      <h4>交通线路</h4>
      <div class="row"><span class="lineSw" style="border-color:var(--ring-inner)"></span>内环高架（实线）</div>
      <div class="row"><span class="lineSw" style="border-color:var(--ring-mid)"></span>中环路（实线）</div>
      <div class="row"><span class="lineSw" style="border-color:var(--ring-outer)"></span>外环高速 S20（实线）</div>
      <div class="row"><span class="lineSw" style="border-color:var(--ring-sub)"></span>绕城高速 G1503（实线）</div>
      <div class="row"><span class="lineSw dash" style="border-color:#e4002b"></span>地铁（虚线·官方线路色）</div>
      <hr>
      <h4>行政区</h4>
      <div class="grid" id="distLegend"></div>
    </div>
    <div id="tileNote">底图瓦片加载失败（可能是网络限制）：板块、环线、地铁信息不受影响。</div>
  </div>
  <footer>
    <span id="verInfo" style="font-weight:600;"></span>
    数据：街镇边界 © OpenStreetMap 贡献者；板块参考价综合房天下/安居客 <span class="dataDateCn"></span>挂牌数据整理，郊区部分为估算，实际成交因楼龄房型差异较大；行政边界：阿里云 DataV。
  </footer>
</div>
<script>
/*__DATA__*/

// ── 版本信息（由 build_map.py 从 boards.py 注入 MAPMETA）──
var META = (typeof MAPMETA !== 'undefined') ? MAPMETA : {version:'', dataDate:'', built:''};
var DATE_CN = META.dataDate ? META.dataDate.replace(/^(\d{4})-0?(\d+)$/, '$1年$2月') : '最新';
try {
  if(META.version){
    document.getElementById('verBadge').textContent = 'v' + META.version + ' · 数据 ' + DATE_CN;
    document.getElementById('verInfo').textContent = 'v' + META.version + '（数据 ' + DATE_CN + '，构建 ' + META.built + '）· ';
    document.title += ' v' + META.version;
  }
  document.querySelectorAll('.dataDateCn').forEach(function(el){ el.textContent = DATE_CN; });
} catch(e) { console.error('版本信息渲染失败:', e); }

// ── 行政区配色（固定顺序，相邻区颜色错开）──
const DCOLOR = {
  "黄浦":"#d62728","静安":"#9467bd","徐汇":"#ff7f0e","长宁":"#bcbd22",
  "普陀":"#17becf","虹口":"#8c564b","杨浦":"#e377c2","浦东":"#2ca02c",
  "闵行":"#1f77b4","宝山":"#e8a838","嘉定":"#b07aa1","青浦":"#2a9d8f",
  "松江":"#f28e2b","奉贤":"#ff9da7","金山":"#9c755f","崇明":"#86bcb6"
};

const map = L.map('map', {zoomControl:true, minZoom:8.5, maxZoom:17, zoomSnap:0.5, zoomDelta:0.5}).setView([31.17, 121.47], 10.5);
L.control.scale({imperial:false}).addTo(map);

let tileOk=false, tileFail=0;
const tiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'© OpenStreetMap © CARTO', subdomains:'abcd', maxZoom:19});
tiles.on('tileload', ()=>{ if(!tileOk){tileOk=true; document.getElementById('tileNote').style.display='none';} });
tiles.on('tileerror', ()=>{ if(!tileOk && ++tileFail>6) document.getElementById('tileNote').style.display='block'; });
tiles.addTo(map);

// ── 双视图数据构建 ──
// 视图 A：板块级（Voronoi 细分）
const cellFillLayer = L.layerGroup();
const cellLblLayer = L.layerGroup();
const cellLblMarkers = [];
CELLS.forEach(t=>{
  const c = DCOLOR[t.dist] || '#999';
  const poly = L.polygon(t.rings, {color:'#ffffff', weight:1.1, opacity:.9, fillColor:c, fillOpacity:.5});
  poly.on('mouseover', e=>e.target.setStyle({fillOpacity:.72, weight:2}));
  poly.on('mouseout', e=>e.target.setStyle({fillOpacity:.5, weight:1.1}));
  let priceHtml='', lblPrice='';
  if(t.lo != null){
    priceHtml = `<div class="pp-price">约 ${t.lo} – ${t.hi} 万/㎡</div>` +
      (t.zone?`<div class="pp-note" style="margin-top:1px">${t.zone}</div>`:'');
    lblPrice = t.lo+'–'+t.hi+'万';
  } else {
    const dp=DIST_PRICE[t.dist];
    if(dp){ priceHtml=`<div class="pp-price">约 ${(dp[0]/10000).toFixed(1)} 万/㎡<span style="font-weight:400;font-size:11px;color:var(--ink3)">（${t.dist}区整体${dp[1]?'·估算':''}）</span></div>`;
            lblPrice='约'+(dp[0]/10000).toFixed(1)+'万'; }
  }
  poly.bindPopup(`<div class="pp-title">${t.name}</div><div class="pp-sub">${t.dist}${t.dist==='浦东'?'新区':'区'}${t.est?' · 街镇（暂无细分板块价）':' · 板块'}</div>
     ${priceHtml}<div class="pp-note">参考挂牌价（万/㎡），${DATE_CN}<br>板块边界为基于板块中心的自动划分，仅供参考</div>`);
  poly.addTo(cellFillLayer);
  const mk = L.marker(t.c, {icon:L.divIcon({className:'twLbl', iconSize:[0,0],
      html:`<span>${t.name}${lblPrice?`<br><span class="pr" data-pr>${lblPrice}</span>`:''}</span>`}), interactive:false});
  mk._area = t.a || 0;
  mk._lat = t.c[0];
  cellLblMarkers.push(mk);
});

// 视图 B：街镇级
const townFillLayer = L.layerGroup();
const townLblLayer = L.layerGroup();
const townLblMarkers = [];
TOWNS.forEach(t=>{
  const c = DCOLOR[t.dist] || '#999';
  const poly = L.polygon(t.rings, {color:'#ffffff', weight:1.3, opacity:.9, fillColor:c, fillOpacity:.5});
  poly.on('mouseover', e=>e.target.setStyle({fillOpacity:.72, weight:2}));
  poly.on('mouseout', e=>e.target.setStyle({fillOpacity:.5, weight:1.3}));
  // 弹窗内容：街镇名 + 匹配的板块价格列表
  let popHtml = `<div class="pp-title">${t.fullname || t.name}</div><div class="pp-sub">${t.dist}${t.dist==='浦东'?'新区':'区'} · 街镇</div>`;
  let lblPrice = '';
  if(t.boards && t.boards.length){
    if(t.boards.length===1){
      const b=t.boards[0];
      popHtml += `<div class="pp-price">约 ${b.lo} – ${b.hi} 万/㎡</div>`;
      if(b.zone) popHtml += `<div class="pp-note" style="margin-top:1px">${b.zone}</div>`;
      lblPrice = b.lo+'–'+b.hi+'万';
    } else {
      popHtml += '<ul class="pp-bd">';
      t.boards.forEach(b=>{ popHtml += `<li><span>${b.name}</span><span>${b.lo}–${b.hi} 万/㎡</span></li>`; });
      popHtml += '</ul>';
      const lo=Math.min(...t.boards.map(b=>b.lo)), hi=Math.max(...t.boards.map(b=>b.hi));
      lblPrice = lo+'–'+hi+'万';
    }
  } else {
    const dp=DIST_PRICE[t.dist];
    if(dp){ popHtml += `<div class="pp-price">约 ${(dp[0]/10000).toFixed(1)} 万/㎡<span style="font-weight:400;font-size:11px;color:var(--ink3)">（${t.dist}区整体${dp[1]?'·估算':''}）</span></div>`;
            lblPrice = '约'+(dp[0]/10000).toFixed(1)+'万'; }
  }
  popHtml += `<div class="pp-note">参考挂牌价（万/㎡），${DATE_CN}</div>`;
  poly.bindPopup(popHtml);
  poly.addTo(townFillLayer);
  const mk = L.marker(t.c, {icon:L.divIcon({className:'twLbl', iconSize:[0,0],
      html:`<span>${t.name}${lblPrice?`<br><span class="pr" data-pr>${lblPrice}</span>`:''}</span>`}), interactive:false});
  mk._area = t.a || 0;
  mk._lat = t.c[0];
  townLblMarkers.push(mk);
});

// ── 街镇界参考线（默认关闭）──
const townLineLayer = L.layerGroup();
TOWNLINES.forEach(r=>{
  L.polyline(r, {color:'#5a6b80', weight:1, opacity:.55, dashArray:'3 4', interactive:false}).addTo(townLineLayer);
});

// ── 视图状态 ──
let curView = 'cell';   // 'cell' | 'town'
let activeFillLayer = cellFillLayer;
let activeLblLayer = cellLblLayer;
let activeLblMarkers = cellLblMarkers;
activeFillLayer.addTo(map);
activeLblLayer.addTo(map);

function switchView(mode){
  if(mode===curView) return;
  // 移除当前图层
  map.removeLayer(activeFillLayer);
  map.removeLayer(activeLblLayer);
  // 切换
  curView = mode;
  if(mode==='cell'){
    activeFillLayer = cellFillLayer;
    activeLblLayer = cellLblLayer;
    activeLblMarkers = cellLblMarkers;
  } else {
    activeFillLayer = townFillLayer;
    activeLblLayer = townLblLayer;
    activeLblMarkers = townLblMarkers;
  }
  // 根据开关状态添加
  if(document.getElementById('ckFill').checked) activeFillLayer.addTo(map);
  activeLblLayer.addTo(map);
  refreshLabels();
}
document.querySelectorAll('#viewToggle .view-btn').forEach(btn=>{
  btn.addEventListener('click', e=>{
    document.querySelectorAll('#viewToggle .view-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    switchView(btn.dataset.view);
  });
});

// 标签按屏幕面积显示
function refreshLabels(){
  const z=map.getZoom();
  const show=document.getElementById('ckLbl').checked;
  const showPr=document.getElementById('ckPr').checked;
  const fs = z>=13 ? 14 : z>=12 ? 12.5 : z>=11 ? 11 : 10;
  document.documentElement.style.setProperty('--lblFs', fs+'px');
  const world = 256*Math.pow(2,z);
  // 阈值：街镇级单元更大，板块级更小
  const nameThreshold = curView==='cell' ? 2600 : 4000;
  const priceThreshold = curView==='cell' ? 6000 : 10000;
  activeLblMarkers.forEach(m=>{
    const px2 = m._area * Math.pow(world/360,2) * Math.cos(m._lat*Math.PI/180);
    const want = show && px2 > nameThreshold;
    const has = activeLblLayer.hasLayer(m);
    if(want&&!has) activeLblLayer.addLayer(m);
    if(!want&&has) activeLblLayer.removeLayer(m);
    if(want){
      const pr=m.getElement() && m.getElement().querySelector('[data-pr]');
      if(pr) pr.style.display = (showPr && px2>priceThreshold) ? '' : 'none';
    }
  });
}
map.on('zoomend', refreshLabels);

// ── 区界描边（较粗白线，凸显行政区分组）──
const distOutline = L.geoJSON(DISTRICTS, {style:{color:'#ffffff', weight:2.6, opacity:.95, fill:false}}).addTo(map);

// ── 环线公路：白色描边 + 实线 ──
const ringStyle = {
  inner:{color:getCss('--ring-inner'), weight:4.5, name:'内环高架路', desc:'围合传统市中心，核心地段分界线'},
  middle:{color:getCss('--ring-mid'), weight:4, name:'中环路', desc:'内环与外环之间的次级快速环线'},
  outer:{color:getCss('--ring-outer'), weight:4, name:'外环高速 S20', desc:'中心城区与郊区的分界，即"外环内/外"'},
  suburb:{color:getCss('--ring-sub'), weight:3.5, name:'上海绕城高速 G1503（郊环）', desc:'环绕近郊各新城'}
};
const ringLayer = L.layerGroup().addTo(map);
Object.entries(RINGS).forEach(([k,paths])=>{
  const s=ringStyle[k];
  paths.forEach(p=>{
    L.polyline(p,{color:'#ffffff',weight:s.weight+2.6,opacity:.85,interactive:false}).addTo(ringLayer);
  });
});
Object.entries(RINGS).forEach(([k,paths])=>{
  const s=ringStyle[k];
  paths.forEach(p=>{
    const line=L.polyline(p,{color:s.color,weight:s.weight,opacity:.95});
    line.bindPopup(`<div class="pp-title">${s.name}</div><div class="pp-note">${s.desc}</div>`);
    line.on('mouseover',e=>e.target.setStyle({weight:s.weight+2}));
    line.on('mouseout',e=>e.target.setStyle({weight:s.weight}));
    line.addTo(ringLayer);
  });
});

// ── 地铁：官方色虚线 ──
const metroLayer = L.layerGroup().addTo(map);
Object.entries(METRO).forEach(([ref,l])=>{
  l.paths.forEach(p=>{
    const line=L.polyline(p,{color:l.colour,weight:2.6,opacity:.95,dashArray:'7 6'});
    line.bindPopup(`<div class="pp-title" style="color:${l.colour}">地铁 ${ref} 号线</div><div class="pp-note">虚线 = 地铁；实线 = 环线公路</div>`);
    line.on('mouseover',e=>e.target.setStyle({weight:5.5}));
    line.on('mouseout',e=>e.target.setStyle({weight:2.6}));
    line.addTo(metroLayer);
  });
});

// ── 图例：行政区 ──
document.getElementById('distLegend').innerHTML =
  Object.entries(DCOLOR).map(([d,c])=>`<div class="row"><span class="swArea" style="background:${c}"></span>${d}</div>`).join('');

// ── 开关 ──
document.getElementById('ckFill').addEventListener('change',e=>{
  if(e.target.checked) activeFillLayer.addTo(map); else map.removeLayer(activeFillLayer);
});
bindToggle('ckRings', ringLayer);
bindToggle('ckMetro', metroLayer);
bindToggle('ckTown', townLineLayer);
document.getElementById('ckLbl').addEventListener('change', refreshLabels);
document.getElementById('ckPr').addEventListener('change', refreshLabels);
function bindToggle(id,layer){
  document.getElementById(id).addEventListener('change',e=>{
    if(e.target.checked) layer.addTo(map); else map.removeLayer(layer);
  });
}
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
refreshLabels();
</script>
</body>
</html>
